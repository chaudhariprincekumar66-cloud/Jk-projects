<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="personalInfoTitle">Personal Information | Shree Jageshwar</title>
  <link rel="icon" href="assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="personal-information">
  <a class="skip-link" href="#main" data-i18n="skipContent">Skip to content</a>
  <div class="app">
    <header class="site-header elevated subpage-header">
      <a class="icon-btn back-link" href="profile.html" aria-label="Back to Profile" data-i18n-aria-label="backProfile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"/></svg></a><span class="header-page-title" data-i18n="personalInfoTitle">Personal Information</span><span class="header-spacer" aria-hidden="true"></span>
    </header>
    <main id="main">
      <section class="account-hero"><div class="crumb"><span class="bar"></span><span data-i18n="profileSection">PROFILE</span></div><h1 data-i18n="personalInfoTitle">Personal Information</h1><p data-i18n="personalInfoLead">View and update your contact details.</p></section>
      <section class="account-body" aria-label="Personal information" data-i18n-aria-label="personalInfoTitle">
        <div class="card personal-card">
          <div class="profile-photo-placeholder" aria-label="Profile photo placeholder" data-i18n-aria-label="profilePhoto"><span class="profile-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span><strong data-i18n="profilePhoto">Profile photo</strong><small data-i18n="photoUploadNote">Photo upload can be enabled with an account service.</small></span></div>
          <form id="personal-info-form" data-local-form="personal-info">
            <div class="field"><label for="profile-name" data-i18n="fullName">Full Name</label><input id="profile-name" name="name" type="text" autocomplete="name" placeholder="Enter your full name" data-i18n-placeholder="enterFullName" disabled /></div>
            <div class="field"><label for="profile-mobile" data-i18n="mobile">Mobile Number</label><input id="profile-mobile" name="mobile" type="tel" inputmode="tel" autocomplete="tel" placeholder="Enter your mobile number" data-i18n-placeholder="enterMobile" disabled /></div>
            <div class="field"><label for="profile-email" data-i18n="emailAddress">Email Address</label><input id="profile-email" name="email" type="email" autocomplete="email" placeholder="Enter your email address" data-i18n-placeholder="enterEmail" disabled /></div>
            <div class="button-row"><button class="btn btn-outline" id="edit-personal" type="button" data-i18n="edit">Edit</button><button class="btn btn-forest" id="save-personal" type="submit" data-i18n="save" disabled>Save</button></div>
            <p class="fine-print" id="personal-status" role="status" aria-live="polite" data-i18n="personalStorageNotice">Changes are stored in this browser only; account syncing is not connected.</p>
          </form>
        </div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="Mobile"></nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="js/components.js"></script><script src="js/main.js"></script><script src="js/settings-pages.js"></script>
</body>
</html>
